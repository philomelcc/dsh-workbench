<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 14px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 13px;
        background: #1b1d22;
        color: #e8eaef;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 14px;
        font-weight: 600;
      }
      p {
        margin: 0 0 12px;
        font-size: 11px;
        color: #9aa0ab;
        line-height: 1.5;
      }
      label {
        display: block;
        margin: 10px 0 4px;
        font-size: 11px;
        color: #9aa0ab;
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid #333842;
        background: #23262d;
        color: #e8eaef;
        font-size: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 12px;
      }
      .state {
        font-size: 11px;
        color: #9aa0ab;
        margin-top: 10px;
        min-height: 16px;
      }
      button {
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid #3a6df0;
        background: #3a6df0;
        color: #fff;
        font-size: 12px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <h1>DSH 下载接管</h1>
    <p>Chrome 的新下载会转给工作台下载中心（迅雷 / aria2）。</p>
    <label>下载中心地址</label>
    <input id="endpoint" type="text" />
    <label>保存目录（留空 = 下载中心默认目录）</label>
    <input id="dir" type="text" />
    <div class="row">
      <span>启用接管</span>
      <input id="enabled" type="checkbox" />
    </div>
    <div class="row">
      <button id="save">保存</button>
    </div>
    <div class="state" id="state"></div>
    <script src="popup.js"></script>
  </body>
</html>
